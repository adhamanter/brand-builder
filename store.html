<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>متجري</title>

    <link rel="stylesheet" href="store.css">

</head>

<body>

    <!-- LOADER -->

    <div id="loader">

        <div class="loader-brand">
            <span id="loaderBrand">BRAND</span>
        </div>

    </div>


    <!-- NAVBAR -->

    <nav>

        <div class="nav-brand" id="brandName">
            BRAND
        </div>

        <div class="nav-center">
            COLLECTION
        </div>

        <a href="#products" class="nav-link">
            SHOP
        </a>

    </nav>


    <!-- HERO -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="eyebrow">
                    NEW COLLECTION
                </p>

                <h1 id="brandTitle">
                    BRAND
                </h1>

                <p
                    id="brandDescription"
                    class="hero-description"
                >
                    اكتشف مجموعتنا الجديدة
                </p>

                <a
                    href="#products"
                    class="hero-button"
                >
                    اكتشف المجموعة
                </a>

            </div>


            <div class="hero-scroll">

                <span>
                    SCROLL
                </span>

                <div class="scroll-line"></div>

            </div>

        </section>


        <!-- MARQUEE -->

        <section class="marquee">

            <div class="marquee-track">

                <span>NEW DROP</span>
                <span>✦</span>
                <span>PREMIUM QUALITY</span>
                <span>✦</span>
                <span>NEW DROP</span>
                <span>✦</span>
                <span>PREMIUM QUALITY</span>
                <span>✦</span>

            </div>

        </section>


        <!-- PRODUCTS -->

        <section
            id="products"
            class="products-section"
        >

            <div class="section-header">

                <div>

                    <p class="eyebrow">
                        THE COLLECTION
                    </p>

                    <h2>
                        OUR PRODUCTS
                    </h2>

                </div>

                <p class="product-count">
                    COLLECTION
                </p>

            </div>


            <div
                id="productsContainer"
                class="products"
            >
            </div>

        </section>


        <!-- CTA -->

        <section class="cta">

            <p class="eyebrow">
                HAVE A QUESTION?
            </p>

            <h2>
                LET'S TALK.
            </h2>

            <a
                id="whatsappButton"
                href="#"
                target="_blank"
                class="cta-button"
            >
                تواصل معنا على واتساب
            </a>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-brand" id="footerBrand">
            BRAND
        </div>

        <p>
            © 2026 All Rights Reserved
        </p>

    </footer>


    <script src="store.js"></script>

</body>

</html>
